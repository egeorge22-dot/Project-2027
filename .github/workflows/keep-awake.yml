# Supabase pauses free projects after a week with no activity.
# This pings the database every 3 days so the hub never goes to sleep.
name: Keep Supabase awake
on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping the database
        run: |
          URL=$(grep -o 'https://[a-z0-9]*\.supabase\.co' config.js | head -1)
          KEY=$(grep -o 'SUPABASE_KEY: *"[^"]*"' config.js | sed 's/.*"\(.*\)"/\1/')
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "config.js not filled in yet"; exit 0; fi
          curl -s -o /dev/null -w "%{http_code}\n" "$URL/rest/v1/docs?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
